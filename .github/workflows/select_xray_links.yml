name: select_xray_links
on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: setup
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl unzip python3 openssh-server
          curl -fsSL -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/download/v25.9.11/Xray-linux-64.zip
          sudo unzip -o /tmp/xray.zip xray -d /usr/local/bin
          sudo chmod +x /usr/local/bin/xray
          sudo mkdir -p /run/sshd
          echo "PermitRootLogin yes" | sudo tee /etc/ssh/sshd_config.d/debug.conf
          echo "PasswordAuthentication yes" | sudo tee -a /etc/ssh/sshd_config.d/debug.conf
          echo "root:runnerdebug" | sudo chpasswd
          sudo /usr/sbin/sshd || true
          curl -fsSL -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared
          # TCP tunnel for SSH (dig cannot resolve tmate.io)
          nohup cloudflared tunnel --no-autoupdate --url tcp://localhost:22 > /tmp/cf.log 2>&1 &
          for i in $(seq 1 20); do
            URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/cf.log | head -1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 1
          done
          echo "==== CLOUDFLARED SSH ===="
          echo "URL=$URL"
          echo "$URL" > /tmp/cf_url.txt
          echo "On dig (43.130.11.12):" | tee /tmp/ssh_hint.txt
          echo "  cloudflared access tcp --hostname ${URL#https://} --url 127.0.0.1:2222 &" | tee -a /tmp/ssh_hint.txt
          echo "  ssh -o StrictHostKeyChecking=no -p 2222 root@127.0.0.1   # pass: runnerdebug" | tee -a /tmp/ssh_hint.txt
          cat /tmp/cf.log || true
          python3 -V
      - name: start select in background
        env:
          PYTHONUNBUFFERED: "1"
          WORKERS_MAX: "32"
          WORKERS_MIN: "4"
          PROGRESS_FILE: data/progress.txt
        run: |
          set -e
          mkdir -p data
          nohup python3 -u select_links.py > data/run.log 2>&1 &
          echo $! > /tmp/select.pid
          echo "select pid=$(cat /tmp/select.pid)"
          sleep 2
          head -20 data/run.log || true
      - name: setup tmate session
        uses: mxschmitt/action-tmate@v3
        continue-on-error: true
        with:
          detached: true
          limit-access-to-actor: false
      - name: wait for select + keep printing SSH hint
        run: |
          set -e
          PID=$(cat /tmp/select.pid)
          while kill -0 "$PID" 2>/dev/null; do
            echo "==== still running pid=$PID $(date -u) ===="
            cat /tmp/ssh_hint.txt 2>/dev/null || true
            echo "---- progress ----"
            tail -5 data/progress.txt 2>/dev/null || true
            echo "---- run.log ----"
            tail -8 data/run.log 2>/dev/null || true
            uptime
            nproc
            sleep 45
          done
          wait "$PID" || true
          echo "select exited"
          tail -30 data/run.log || true
      - name: commit results
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "update selected xray links"
          git push
